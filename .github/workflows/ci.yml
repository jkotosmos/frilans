name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Typecheck, lint, build
    runs-on: ubuntu-latest
    env:
      # CI only needs to prove the code compiles/lints/builds — no page in
      # this app queries the database at build time (see README: every route
      # is dynamically rendered), so a throwaway SQLite file and a dummy
      # secret are enough. Real deploys use their own DATABASE_URL /
      # NEXTAUTH_SECRET from repo/host secrets, never these.
      DATABASE_URL: "file:./ci.db"
      NEXTAUTH_SECRET: "ci-only-placeholder-not-used-anywhere-real"
      NEXTAUTH_URL: "http://localhost:3000"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Create throwaway CI database schema
        # Every route in this app is dynamically rendered (see README), so
        # nothing here ever needs *this* database's data to be meaningful —
        # but `next build` still does a trial render of each route to decide
        # that, and an empty SQLite file with no tables makes that trial
        # render throw a wall of Prisma "table does not exist" errors into
        # the build log. They're caught and harmless (Next falls back to
        # dynamic rendering correctly either way), but they look exactly
        # like a real failure at a glance. Pushing the schema first keeps
        # the CI log honest: silent when nothing is actually wrong.
        run: npm run db:push

      - name: Build
        run: npm run build
