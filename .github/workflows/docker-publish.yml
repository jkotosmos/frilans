name: Publish Docker image

# Builds the self-hosted, Postgres-backed image (see Dockerfile,
# DEPLOYMENT.md "Полная динамическая версия") — the dynamic version with
# real accounts and a real database, not the GitHub Pages static demo that
# deploy-pages.yml publishes. Manual-only for now, since the current default
# is the static demo (see README); run this yourself when you're ready to
# stand up the dynamic version somewhere with a database.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
